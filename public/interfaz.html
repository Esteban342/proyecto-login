<!-- Interfaz de usuario para el sistema de login y registro. -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <h2 id="form-title">Iniciar Sesión</h2>
            
            <!-- Contenedor para mensajes de éxito o error -->
            <div id="mensaje" class="alert hidden"></div>

            <form id="login-form">
                <div class="input-group">
                    <label>Correo electrónico:</label>
                    <input type="email" name="user_email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label>Contraseña:</label>
                    <input type="password" name="user_password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" id="submit-btn">Ingresar</button>
            </form>

            <p class="toggle-text">
                <span id="toggle-msg">¿No tienes cuenta?</span> 
                <a href="#" id="toggle-link">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
